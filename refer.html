<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রেফার করুন | BD Rocket Income</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand"><img src="assets/logo.jpg" alt="logo">BD ROCKET INCOME</div>
    <button class="icon-btn" onclick="window.location.href='dashboard.html'">✕</button>
  </div>
</div>

<div class="container" style="margin-top:20px;">

  <div class="card center">
    <div class="section-title" style="justify-content:center;">👥 বন্ধু রেফার করে আয় করুন</div>
    <p class="muted">আপনার লিংক দিয়ে কেউ সাইনআপ করে অ্যাকাউন্ট একটিভ করলেই আপনি বোনাস পাবেন</p>
    <div class="badge badge-blue" id="refCodeBadge" style="font-size:15px;padding:10px 18px;">লোড হচ্ছে...</div>
    <button class="btn btn-outline mt-16" onclick="copyLink()">🔗 লিংক কপি করুন</button>
  </div>

  <div class="card">
    <div class="section-title">📋 আমার টিম</div>
    <table>
      <thead><tr><th>নাম</th><th>স্ট্যাটাস</th></tr></thead>
      <tbody id="teamBody">
        <tr><td colspan="2" class="muted center">লোড হচ্ছে...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<div class="bottom-nav">
  <a href="#" class="nav-item">🎧<span>Help</span></a>
  <a href="wallet.html" class="nav-item">💳<span>Wallet</span></a>
  <a href="dashboard.html" class="nav-item">🏠<span>Home</span></a>
  <a href="refer.html" class="nav-item active">👥<span>Team</span></a>
  <a href="profile.html" class="nav-item">👤<span>Profile</span></a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
  let myRefCode = "";
  loadUserProfile(function(profile){
    myRefCode = profile.refCode;
    document.getElementById('refCodeBadge').textContent = myRefCode;

    const restriction = profile.restrictions && profile.restrictions.refer;
    if(restriction && restriction.enabled === false){
      document.querySelector('.card.center').innerHTML =
        '<div class="section-title" style="justify-content:center;">🚫 রেফার সিস্টেম বন্ধ আছে</div>' +
        '<p class="muted">' + (restriction.reason || 'অ্যাডমিন আপনার রেফার সুবিধা আপাতত বন্ধ রেখেছেন।') + '</p>';
    }

    db.collection("users").where("referredBy","==", myRefCode).get().then(function(snap){
      const body = document.getElementById('teamBody');
      if(snap.empty){
        body.innerHTML = '<tr><td colspan="2" class="muted center">এখনো কেউ জয়েন করেনি</td></tr>';
        return;
      }
      body.innerHTML = "";
      snap.forEach(doc=>{
        const d = doc.data();
        const badgeClass = d.activationStatus === "approved" ? "badge-approved" : "badge-pending";
        body.innerHTML += `<tr><td>${d.name}</td><td><span class="badge ${badgeClass}">${d.activationStatus}</span></td></tr>`;
      });
    });
  });

  function copyLink(){
    const link = window.location.origin + window.location.pathname.replace("refer.html","index.html") + "?ref=" + myRefCode;
    navigator.clipboard.writeText(link).then(()=>{
      alert("লিংক কপি হয়েছে!");
    });
  }
</script>
</body>
</html>
