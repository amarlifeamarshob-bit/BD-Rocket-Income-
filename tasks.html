<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>টাস্ক | BD Rocket Income</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .task-list { display: grid; gap: 16px; }
  .task-card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 10px 24px rgba(11,31,77,0.08);
  }
  .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .task-header h3 { margin: 0; font-size: 17px; }
  .task-rate { background: linear-gradient(90deg, #f2b705, #ffd966); color: #0b1f4d; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 13px; }
  .instruction-box { 
    background: #e8f5e9; 
    border: 2px solid #4caf50;
    color: #1b5e20;
    padding: 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.7;
    margin: 12px 0;
  }
  .pin-display { 
    background: #e3f6ea;
    border: 1px dashed #4caf50;
    color: #1b5e20;
    padding: 10px;
    border-radius: 8px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pin-copy { background: #4caf50; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; }
  .field-group { margin-bottom: 14px; }
  .field-group label { font-weight: 700; font-size: 13px; margin-bottom: 6px; display: block; }
  .field-group input, .field-group textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #e3e7f0; font-size: 14px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand"><img src="assets/logo.jpg" alt="logo">BD ROCKET INCOME</div>
    <button class="icon-btn" onclick="window.location.href='dashboard.html'">✕</button>
  </div>
</div>

<div class="container" style="margin-top:20px;">

  <div id="tasksContainer" class="task-list">
    <p class="center muted">টাস্ক লোড হচ্ছে...</p>
  </div>

  <div class="card">
    <div class="section-title">📜 সাম্প্রতিক সাবমিশন</div>
    <table>
      <thead><tr><th>টাস্ক</th><th>পরিমাণ</th><th>স্ট্যাটাস</th></tr></thead>
      <tbody id="historyBody">
        <tr><td colspan="3" class="muted center">লোড হচ্ছে...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<div class="bottom-nav">
  <a href="#" class="nav-item">🎧<span>Help</span></a>
  <a href="wallet.html" class="nav-item">💳<span>Wallet</span></a>
  <a href="dashboard.html" class="nav-item">🏠<span>Home</span></a>
  <a href="refer.html" class="nav-item">👥<span>Team</span></a>
  <a href="profile.html" class="nav-item">👤<span>Profile</span></a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
  let currentUid = null;

  loadUserProfile(function(profile){
    currentUid = profile.uid;
    if(profile.activationStatus !== "approved"){
      window.location.href = "activate.html";
      return;
    }
    loadTasks(profile.uid);
  });

  function loadTasks(uid){
    db.collection("tasks").orderBy("createdAt", "desc").get().then(snap=>{
      const container = document.getElementById('tasksContainer');
      if(snap.empty){
        container.innerHTML = '<p class="center muted">এখনো কোনো টাস্ক নেই</p>';
        return;
      }
      container.innerHTML = "";
      snap.forEach(doc=>{
        const task = doc.data();
        const html = `
          <div class="task-card">
            <div class="task-header">
              <h3>${task.name}</h3>
              <span class="task-rate">৳${task.rate.toFixed(2)}</span>
            </div>
            <div class="instruction-box">${task.instructions}</div>
            <div class="pin-display">
              <span>PIN: <strong>${task.pin}</strong></span>
              <button class="pin-copy" onclick="copyPin('${task.pin}')">কপি করুন</button>
            </div>
            <div class="field-group">
              <label>1</label>
              <input type="text" class="field-1-${doc.id}" placeholder="">
            </div>
            <div class="field-group">
              <label>2</label>
              <input type="text" class="field-2-${doc.id}" placeholder="">
            </div>
            <div class="field-group">
              <label>3</label>
              <input type="text" class="field-3-${doc.id}" placeholder="">
            </div>
            <button class="btn btn-primary" onclick="submitTaskForm('${doc.id}', '${task.name}', ${task.rate})">সাবমিট করুন</button>
            <div id="alert-${doc.id}"></div>
          </div>
        `;
        container.innerHTML += html;
      });
      loadHistory(uid);
    });
  }

  function copyPin(pin){
    navigator.clipboard.writeText(pin).then(()=>alert("কপি হয়েছে"));
  }

  function submitTaskForm(taskId, taskName, rate){
    const field1 = document.querySelector('.field-1-' + taskId).value.trim();
    const field2 = document.querySelector('.field-2-' + taskId).value.trim();
    const field3 = document.querySelector('.field-3-' + taskId).value.trim();
    const alertBox = document.getElementById('alert-' + taskId);
    alertBox.innerHTML = "";

    if(!field1 || !field2 || !field3){
      alertBox.innerHTML = '<div class="alert alert-error">সব ঘর পূরণ করুন</div>';
      return;
    }

    db.collection("submissions").add({
      uid: currentUid,
      taskId: taskId,
      taskName: taskName,
      field1: field1,
      field2: field2,
      field3: field3,
      amount: rate,
      status: "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(()=>{
      alertBox.innerHTML = '<div class="alert alert-success">সাবমিট হয়েছে — অ্যাডমিন অনুমোদনের পর টাকা যোগ হবে</div>';
      document.querySelector('.field-1-' + taskId).value = "";
      document.querySelector('.field-2-' + taskId).value = "";
      document.querySelector('.field-3-' + taskId).value = "";
      loadHistory(currentUid);
    }).catch(err=>{
      alertBox.innerHTML = '<div class="alert alert-error">সমস্যা: ' + err.message + '</div>';
    });
  }

  function loadHistory(uid){
    db.collection("submissions").where("uid","==",uid)
      .orderBy("createdAt","desc").limit(10).get().then(snap=>{
        const body = document.getElementById('historyBody');
        if(snap.empty){
          body.innerHTML = '<tr><td colspan="3" class="muted center">এখনো কোনো সাবমিশন নেই</td></tr>';
          return;
        }
        body.innerHTML = "";
        snap.forEach(doc=>{
          const d = doc.data();
          const badgeClass = d.status === "approved" ? "badge-approved" : d.status === "rejected" ? "badge-rejected" : "badge-pending";
          body.innerHTML += `<tr><td>${d.taskName}</td><td>৳${(d.amount||0).toFixed(2)}</td><td><span class="badge ${badgeClass}">${d.status}</span></td></tr>`;
        });
      });
  }
</script>
</body>
</html>
