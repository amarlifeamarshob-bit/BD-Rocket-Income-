<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>টাস্ক | BD Rocket Income</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand"><img src="assets/logo.jpg" alt="logo">BD ROCKET INCOME</div>
    <button class="icon-btn" onclick="window.location.href='dashboard.html'">✕</button>
  </div>
</div>

<div class="container" style="margin-top:20px;">

  <div class="card">
    <div class="row-between">
      <div class="section-title" id="taskTitle">টাস্ক</div>
      <span class="badge badge-gold" id="taskRate">Rate: ৳0.00</span>
    </div>
    <p class="muted" id="taskDesc">টাস্ক সম্পন্ন করার প্রমাণ (screenshot link / task ID) জমা দিন। অ্যাডমিন যাচাই করার পর টাকা আপনার ব্যালেন্সে যোগ হবে।</p>

    <div id="alertBox"></div>

    <div id="adFields" class="hidden">
      <div id="adFormBox"><p class="muted center">লোড হচ্ছে...</p></div>
    </div>

    <div id="surveyFields" class="hidden">
      <div id="surveyQuestionBox"><p class="muted center">প্রশ্ন লোড হচ্ছে...</p></div>
    </div>

    <div id="microjobFields" class="hidden">
      <label>কাজের বিবরণ</label>
      <textarea id="microjobText" rows="4" placeholder="যেমন: সম্পন্ন করা ডেটা এন্ট্রি/টাইপিং কাজের বিবরণ লিখুন"></textarea>
    </div>

    <button class="btn btn-primary" id="submitTaskBtn" onclick="submitTask()">সাবমিট করুন</button>
  </div>

  <div class="card">
    <div class="section-title">📜 সাম্প্রতিক সাবমিশন</div>
    <table>
      <thead><tr><th>টাইপ</th><th>পরিমাণ</th><th>স্ট্যাটাস</th></tr></thead>
      <tbody id="historyBody">
        <tr><td colspan="3" class="muted center">লোড হচ্ছে...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<div class="bottom-nav">
  <a href="#" class="nav-item">🎧<span>Help</span></a>
  <a href="wallet.html" class="nav-item">💳<span>Wallet</span></a>
  <a href="dashboard.html" class="nav-item">🏠<span>Home</span></a>
  <a href="refer.html" class="nav-item">👥<span>Team</span></a>
  <a href="profile.html" class="nav-item">👤<span>Profile</span></a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const taskType = params.get("type") || "ad";
  const titles = { ad: "📺 Ad ভিউ", survey: "📝 সার্ভে পূরণ", microjob: "⌨️ মাইক্রো জব" };
  document.getElementById('taskTitle').textContent = titles[taskType] || "টাস্ক";
  document.getElementById(taskType === "ad" ? "adFields" : taskType === "survey" ? "surveyFields" : "microjobFields").classList.remove("hidden");

  let currentUid = null;
  let currentRate = 0;

  loadUserProfile(function(profile){
    currentUid = profile.uid;
    if(profile.activationStatus !== "approved"){
      window.location.href = "activate.html";
      return;
    }

    // Admin can turn off individual task types per-user, with a reason.
    const restriction = profile.restrictions && profile.restrictions[taskType];
    if(restriction && restriction.enabled === false){
      document.querySelector('.container').innerHTML =
        '<div class="card"><div class="section-title">🚫 এই টাস্কটি বন্ধ আছে</div>' +
        '<p class="muted">' + (restriction.reason || 'অ্যাডমিন এই টাস্কটি আপাতত বন্ধ রেখেছেন।') + '</p>' +
        '<a href="dashboard.html" class="btn btn-outline mt-16">হোমে ফিরে যান</a></div>';
      return;
    }

    // Rates are set by admin in settings/rates — falls back to 0 until configured
    db.collection("settings").doc("rates").get().then(function(doc){
      const rates = doc.exists ? doc.data() : {};
      currentRate = rates[taskType] || 0;
      document.getElementById('taskRate').textContent = "Rate: ৳" + currentRate.toFixed(2);
      if(taskType === "survey") loadSurveyQuestion(profile.uid);
      if(taskType === "ad") loadAdForm();
    });
    loadHistory(profile.uid);
  });

  let currentAdLabels = [];

  function loadAdForm(){
    const box = document.getElementById('adFormBox');
    db.collection("settings").doc("adForm").get().then(function(doc){
      const d = doc.exists ? doc.data() : {};
      currentAdLabels = (d.labels && d.labels.length === 3) ? d.labels
        : ["বিজ্ঞাপন লিংক", "স্ক্রিনশট লিংক", "সময়"];
      box.innerHTML = currentAdLabels.map(function(label, i){
        return '<label>' + label + '</label>' +
          '<input type="text" id="adField' + i + '" placeholder="' + label + '">';
      }).join('');
    }).catch(function(){
      currentAdLabels = ["বিজ্ঞাপন লিংক", "স্ক্রিনশট লিংক", "সময়"];
      box.innerHTML = currentAdLabels.map(function(label, i){
        return '<label>' + label + '</label>' +
          '<input type="text" id="adField' + i + '" placeholder="' + label + '">';
      }).join('');
    });
  }

  let currentQuestion = null;

  function loadSurveyQuestion(uid){
    const box = document.getElementById('surveyQuestionBox');
    box.innerHTML = '<p class="muted center">প্রশ্ন লোড হচ্ছে...</p>';
    Promise.all([
      db.collection("questions").orderBy("createdAt","desc").get(),
      db.collection("submissions").where("uid","==",uid).where("type","==","survey").get()
    ]).then(function(results){
      const qSnap = results[0];
      const subSnap = results[1];
      const answeredIds = new Set();
      subSnap.forEach(function(doc){
        const p = doc.data().proof;
        if(p && p.questionId) answeredIds.add(p.questionId);
      });
      const remaining = [];
      qSnap.forEach(function(doc){
        if(!answeredIds.has(doc.id)) remaining.push(Object.assign({ id: doc.id }, doc.data()));
      });
      if(remaining.length === 0){
        currentQuestion = null;
        box.innerHTML = '<p class="muted center">✅ আপাতত নতুন কোনো প্রশ্ন নেই — পরে আবার চেষ্টা করুন</p>';
        document.getElementById('submitTaskBtn').style.display = 'none';
        return;
      }
      const q = remaining[Math.floor(Math.random() * remaining.length)];
      currentQuestion = q;
      document.getElementById('submitTaskBtn').style.display = '';
      renderSurveyQuestion(q);
    }).catch(function(err){
      box.innerHTML = '<p class="muted center">প্রশ্ন লোড করতে সমস্যা হয়েছে: ' + err.message + '</p>';
    });
  }

  function renderSurveyQuestion(q){
    const box = document.getElementById('surveyQuestionBox');
    const reward = (q.reward != null && q.reward !== "") ? q.reward : currentRate;
    document.getElementById('taskRate').textContent = "Rate: ৳" + Number(reward).toFixed(2);
    if(q.answerType === "text"){
      box.innerHTML =
        '<label>' + q.question + '</label>' +
        '<textarea id="surveyAnswerText" rows="3" placeholder="আপনার উত্তর লিখুন/পেস্ট করুন"></textarea>';
    } else {
      const opts = q.options || [];
      box.innerHTML = '<label>' + q.question + '</label>' + opts.map(function(opt, i){
        return '<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:8px;">' +
          '<input type="radio" name="surveyOpt" value="' + i + '" style="width:auto;">' + opt + '</label>';
      }).join('');
    }
  }

  function loadHistory(uid){
    db.collection("submissions").where("uid","==",uid).where("type","==",taskType)
      .orderBy("createdAt","desc").limit(10).get().then(function(snap){
        const body = document.getElementById('historyBody');
        if(snap.empty){
          body.innerHTML = '<tr><td colspan="3" class="muted center">এখনো কোনো সাবমিশন নেই</td></tr>';
          return;
        }
        body.innerHTML = "";
        snap.forEach(doc=>{
          const d = doc.data();
          const badgeClass = d.status === "approved" ? "badge-approved" : d.status === "rejected" ? "badge-rejected" : "badge-pending";
          body.innerHTML += `<tr><td>${titles[d.type]||d.type}</td><td>৳${(d.amount||0).toFixed(2)}</td><td><span class="badge ${badgeClass}">${d.status}</span></td></tr>`;
        });
      }).catch(()=>{
        document.getElementById('historyBody').innerHTML = '<tr><td colspan="3" class="muted center">লোড করা যায়নি</td></tr>';
      });
  }

  function submitTask(){
    const alertBox = document.getElementById('alertBox');
    alertBox.innerHTML = "";
    let proofFields = {};
    let rewardAmount = currentRate;

    if(taskType === "ad"){
      const values = [];
      for(let i = 0; i < currentAdLabels.length; i++){
        const v = document.getElementById('adField' + i).value.trim();
        if(!v){ alertBox.innerHTML = '<div class="alert alert-error">সব ঘর পূরণ করুন</div>'; return; }
        values.push(v);
      }
      proofFields = {
        fields: currentAdLabels.map(function(label, i){ return { label: label, value: values[i] }; })
      };
    } else if(taskType === "survey"){
      if(!currentQuestion){
        alertBox.innerHTML = '<div class="alert alert-error">এই মুহূর্তে কোনো প্রশ্ন নেই</div>';
        return;
      }
      rewardAmount = (currentQuestion.reward != null && currentQuestion.reward !== "") ? currentQuestion.reward : currentRate;
      if(currentQuestion.answerType === "text"){
        const text = document.getElementById('surveyAnswerText').value.trim();
        if(!text){ alertBox.innerHTML = '<div class="alert alert-error">উত্তর লিখুন</div>'; return; }
        proofFields = {
          questionId: currentQuestion.id, question: currentQuestion.question,
          answerType: "text", answerText: text
        };
      } else {
        const checked = document.querySelector('input[name="surveyOpt"]:checked');
        if(!checked){ alertBox.innerHTML = '<div class="alert alert-error">একটা অপশন বাছাই করুন</div>'; return; }
        const idx = parseInt(checked.value, 10);
        proofFields = {
          questionId: currentQuestion.id, question: currentQuestion.question,
          answerType: "options", selectedIndex: idx, selectedOption: currentQuestion.options[idx],
          isCorrect: idx === currentQuestion.correctIndex
        };
      }
    } else {
      const text = document.getElementById('microjobText').value.trim();
      if(!text){ alertBox.innerHTML = '<div class="alert alert-error">কাজের বিবরণ লিখুন</div>'; return; }
      proofFields = { description: text };
    }

    submitTaskProof({ uid: currentUid, type: taskType, rate: rewardAmount, proofFields }).then(()=>{
      alertBox.innerHTML = '<div class="alert alert-success">সাবমিট হয়েছে — অ্যাডমিন অনুমোদনের পর টাকা যোগ হবে</div>';
      loadHistory(currentUid);
      if(taskType === "survey") loadSurveyQuestion(currentUid);
      if(taskType === "ad") loadAdForm();
    }).catch(err=>{
      alertBox.innerHTML = '<div class="alert alert-error">সমস্যা: ' + err.message + '</div>';
    });
  }
</script>
</body>
</html>
