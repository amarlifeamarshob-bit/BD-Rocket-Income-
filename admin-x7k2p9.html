<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | BD Rocket Income</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{max-width:900px;margin:0 auto;padding:20px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .tabs button{padding:9px 16px;border-radius:9px;border:none;background:#eef1fa;font-weight:700;cursor:pointer;font-size:13px;}
  .tabs button.active{background:var(--blue);color:#fff;}
  .section{display:none;}
  .section.active{display:block;}
  .rate-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
  .rate-row label{flex:1;margin:0;}
  .rate-row input{margin:0;width:120px;}
</style>
</head>
<body>

<div id="loginSection" style="max-width:380px;margin:60px auto;text-align:center;">
  <div style="font-size:40px;">🔒</div>
  <h2>অ্যাডমিন প্যানেল</h2>
  <div id="loginAlert"></div>
  <input type="password" id="adminCode" placeholder="কোড দিন" style="text-align:center;">
  <button class="btn btn-primary" onclick="adminLogin()">প্রবেশ করুন</button>
  <p class="muted mt-16"><a href="dashboard.html">← হোমে ফিরে যান</a></p>
</div>

<div id="adminPanel" class="hidden">

  <div class="tabs">
    <button class="active" onclick="showSection('activations',this)">Activations</button>
    <button onclick="showSection('submissions',this)">Task Submissions</button>
    <button onclick="showSection('withdrawals',this)">Withdrawals</button>
    <button onclick="showSection('rates',this)">Rates</button>
  </div>

  <div id="activations" class="section active card">
    <h3>একটিভেশন অনুরোধ</h3>
    <table>
      <thead><tr><th>নাম</th><th>ফোন</th><th>Trx ID</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead>
      <tbody id="activationsBody"><tr><td colspan="5" class="muted center">লোড হচ্ছে...</td></tr></tbody>
    </table>
  </div>

  <div id="submissions" class="section card">
    <h3>টাস্ক সাবমিশন</h3>
    <table>
      <thead><tr><th>টাইপ</th><th>পরিমাণ</th><th>প্রমাণ</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead>
      <tbody id="submissionsBody"><tr><td colspan="5" class="muted center">লোড হচ্ছে...</td></tr></tbody>
    </table>
  </div>

  <div id="withdrawals" class="section card">
    <h3>উইথড্র রিকোয়েস্ট</h3>
    <table>
      <thead><tr><th>পরিমাণ</th><th>নিট</th><th>মেথড</th><th>নম্বর</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead>
      <tbody id="withdrawalsBody"><tr><td colspan="6" class="muted center">লোড হচ্ছে...</td></tr></tbody>
    </table>
  </div>

  <div id="rates" class="section card">
    <h3>টাস্ক রেট সেট করুন</h3>
    <div class="rate-row"><label>Ad ভিউ (৳)</label><input type="number" id="rateAd" step="0.01"></div>
    <div class="rate-row"><label>সার্ভে (৳)</label><input type="number" id="rateSurvey" step="0.01"></div>
    <div class="rate-row"><label>মাইক্রো জব (৳)</label><input type="number" id="rateMicrojob" step="0.01"></div>
    <div class="rate-row"><label>রেফারেল বোনাস (৳)</label><input type="number" id="rateReferral" step="0.01"></div>
    <button class="btn btn-primary" onclick="saveRates()">সেভ করুন</button>
    <div id="ratesAlert" class="mt-16"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  // ================================================================
  // ACCESS CONTROL: only UIDs listed in Firestore collection "admins"
  // (document ID = the admin's UID) can use this panel.
  // Create it manually once in Firebase Console after your own admin
  // account signs up normally through index.html.
  // ================================================================

  // This is the ONLY email tied to the admin account behind the
  // scenes. The user never sees or types it — they just enter the
  // code, which is actually their Firebase account password. Real
  // verification happens on Firebase's server (signInWithEmailAndPassword)
  // plus the Firestore "admins" collection check below — neither can
  // be bypassed by viewing the page source.
  const ADMIN_EMAIL = "gojolsong@gmail.com";

  function showSection(id, btn){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }

  function adminLogin(){
    const code = document.getElementById('adminCode').value;
    const alertBox = document.getElementById('loginAlert');
    alertBox.innerHTML = "";
    if(!code){
      alertBox.innerHTML = '<div class="alert alert-error">কোড দিন</div>';
      return;
    }
    auth.signInWithEmailAndPassword(ADMIN_EMAIL, code).then(cred=>{
      return db.collection("admins").doc(cred.user.uid).get();
    }).then(doc=>{
      if(doc.exists){
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadActivations();
        loadSubmissions();
        loadWithdrawals();
        loadRates();
      } else {
        auth.signOut();
        alertBox.innerHTML = '<div class="alert alert-error">ভুল কোড</div>';
      }
    }).catch(()=>{
      alertBox.innerHTML = '<div class="alert alert-error">ভুল কোড</div>';
    });
  }

  function loadActivations(){
    db.collection("users").where("activationStatus","in",["pending","approved","rejected"]).get().then(snap=>{
      const body = document.getElementById('activationsBody');
      body.innerHTML = "";
      snap.forEach(doc=>{
        const d = doc.data();
        body.innerHTML += `<tr>
          <td>${d.name}</td><td>${d.phone}</td><td>${d.activationTrxId||"-"}</td>
          <td><span class="badge badge-${d.activationStatus==='approved'?'approved':d.activationStatus==='rejected'?'rejected':'pending'}">${d.activationStatus}</span></td>
          <td>
            <button class="btn btn-outline" style="width:auto;padding:6px 10px;font-size:12px;" onclick="setActivation('${doc.id}','approved')">Approve</button>
            <button class="btn btn-danger" style="width:auto;padding:6px 10px;font-size:12px;" onclick="setActivation('${doc.id}','rejected')">Reject</button>
          </td>
        </tr>`;
      });
    });
  }

  function setActivation(uid, status){
    db.collection("users").doc(uid).update({ activationStatus: status }).then(loadActivations);
  }

  function loadSubmissions(){
    db.collection("submissions").where("status","==","pending").get().then(snap=>{
      const body = document.getElementById('submissionsBody');
      if(snap.empty){ body.innerHTML = '<tr><td colspan="5" class="muted center">কোনো পেন্ডিং সাবমিশন নেই</td></tr>'; return; }
      body.innerHTML = "";
      snap.forEach(doc=>{
        const d = doc.data();
        body.innerHTML += `<tr>
          <td>${d.type}</td><td>৳${(d.amount||0).toFixed(2)}</td><td>${JSON.stringify(d.proof)}</td>
          <td><span class="badge badge-pending">pending</span></td>
          <td>
            <button class="btn btn-outline" style="width:auto;padding:6px 10px;font-size:12px;" onclick="approveSubmission('${doc.id}','${d.uid}',${d.amount})">Approve</button>
            <button class="btn btn-danger" style="width:auto;padding:6px 10px;font-size:12px;" onclick="rejectSubmission('${doc.id}')">Reject</button>
          </td>
        </tr>`;
      });
    });
  }

  function approveSubmission(subId, uid, amount){
    const userRef = db.collection("users").doc(uid);
    db.runTransaction(t=>{
      return t.get(userRef).then(doc=>{
        const newBalance = (doc.data().balance || 0) + amount;
        t.update(userRef, { balance: newBalance });
        t.update(db.collection("submissions").doc(subId), { status: "approved" });
      });
    }).then(loadSubmissions);
  }

  function rejectSubmission(subId){
    db.collection("submissions").doc(subId).update({ status: "rejected" }).then(loadSubmissions);
  }

  function loadWithdrawals(){
    db.collection("withdrawals").where("status","==","pending").get().then(snap=>{
      const body = document.getElementById('withdrawalsBody');
      if(snap.empty){ body.innerHTML = '<tr><td colspan="6" class="muted center">কোনো পেন্ডিং উইথড্র নেই</td></tr>'; return; }
      body.innerHTML = "";
      snap.forEach(doc=>{
        const d = doc.data();
        body.innerHTML += `<tr>
          <td>৳${d.amount.toFixed(2)}</td><td>৳${d.netAmount.toFixed(2)}</td><td>${d.method}</td><td>${d.accountNumber}</td>
          <td><span class="badge badge-pending">pending</span></td>
          <td>
            <button class="btn btn-outline" style="width:auto;padding:6px 10px;font-size:12px;" onclick="approveWithdrawal('${doc.id}','${d.uid}',${d.amount})">Paid & Approve</button>
            <button class="btn btn-danger" style="width:auto;padding:6px 10px;font-size:12px;" onclick="rejectWithdrawal('${doc.id}')">Reject</button>
          </td>
        </tr>`;
      });
    });
  }

  function approveWithdrawal(wId, uid, amount){
    const userRef = db.collection("users").doc(uid);
    db.runTransaction(t=>{
      return t.get(userRef).then(doc=>{
        const newBalance = (doc.data().balance || 0) - amount;
        t.update(userRef, { balance: newBalance });
        t.update(db.collection("withdrawals").doc(wId), { status: "approved" });
      });
    }).then(loadWithdrawals);
  }

  function rejectWithdrawal(wId){
    db.collection("withdrawals").doc(wId).update({ status: "rejected" }).then(loadWithdrawals);
  }

  function loadRates(){
    db.collection("settings").doc("rates").get().then(doc=>{
      const r = doc.exists ? doc.data() : {};
      document.getElementById('rateAd').value = r.ad || 0;
      document.getElementById('rateSurvey').value = r.survey || 0;
      document.getElementById('rateMicrojob').value = r.microjob || 0;
      document.getElementById('rateReferral').value = r.referral || 0;
    });
  }

  function saveRates(){
    const rates = {
      ad: parseFloat(document.getElementById('rateAd').value) || 0,
      survey: parseFloat(document.getElementById('rateSurvey').value) || 0,
      microjob: parseFloat(document.getElementById('rateMicrojob').value) || 0,
      referral: parseFloat(document.getElementById('rateReferral').value) || 0
    };
    db.collection("settings").doc("rates").set(rates).then(()=>{
      document.getElementById('ratesAlert').innerHTML = '<div class="alert alert-success">রেট সেভ হয়েছে</div>';
    });
  }
</script>
</body>
</html>
