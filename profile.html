<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রোফাইল | BD Rocket Income</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand"><img src="assets/logo.jpg" alt="logo">BD ROCKET INCOME</div>
    <button class="icon-btn" onclick="window.location.href='dashboard.html'">✕</button>
  </div>
</div>

<div class="container" style="margin-top:20px;">
  <div class="card center">
    <div class="avatar" style="width:70px;height:70px;font-size:28px;margin:0 auto 10px;" id="avatarInitial">U</div>
    <h2 id="pName">—</h2>
    <p class="muted" id="pEmail">—</p>
    <p class="muted" id="pPhone">—</p>
    <span class="badge badge-approved">Account Active</span>
  </div>

  <div class="card">
    <button class="btn btn-danger" onclick="logout()">লগ আউট</button>
  </div>
</div>

<div class="bottom-nav">
  <a href="#" class="nav-item">🎧<span>Help</span></a>
  <a href="wallet.html" class="nav-item">💳<span>Wallet</span></a>
  <a href="dashboard.html" class="nav-item">🏠<span>Home</span></a>
  <a href="refer.html" class="nav-item">👥<span>Team</span></a>
  <a href="profile.html" class="nav-item active">👤<span>Profile</span></a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
  loadUserProfile(function(profile){
    document.getElementById('pName').textContent = profile.name;
    document.getElementById('pEmail').textContent = profile.email;
    document.getElementById('pPhone').textContent = profile.phone;
    document.getElementById('avatarInitial').textContent = (profile.name||"U")[0].toUpperCase();
  });
</script>
</body>
</html>
